# RestaurantOS delivery pipeline — builds every image and deploys to k3s on the VPS.
#
#   push to main  → restaurantos-dev  → https://dev.restaurantos.softxlogic.com
#   push to prod  → restaurantos-prod → https://restaurantos.softxlogic.com
#
# ── Three design decisions worth knowing before you edit this ────────────────
#
# 1. ONE Maven build, eighteen thin images.
#    Every services/*/Dockerfile builds the WHOLE reactor from scratch. Running
#    eighteen of those is eighteen builds of shared-lib and its dependency tree.
#    This workflow runs `mvn package` once and each Dockerfile.ci merely COPYs
#    the jar that build produced.
#
# 2. Deployment goes over SSH, not by handing GitHub a kubeconfig.
#    The alternative is exposing the Kubernetes API on 6443 to the internet so a
#    runner can reach it. On a box that also serves this company's mail, DNS and
#    every CyberPanel customer site, that is not a trade worth making. The runner
#    holds an SSH key and nothing else; the cluster stays bound to localhost.
#
# 3. Application secrets are NOT GitHub secrets.
#    Database passwords, the JWT signing key and the field-encryption key are
#    generated on the server by deploy/k8s/bootstrap-secrets.sh and never leave
#    it. A compromised repository therefore does not imply compromised data.
#    GitHub holds four values, all of them access to the deploy path itself.
name: Deploy

on:
  push:
    branches: [main, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  # Never let two deploys of the same environment interleave — the second would
  # race the first's rollout and `rollout status` would report on a ReplicaSet
  # that is already being replaced.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      env:       ${{ steps.pick.outputs.env }}
      namespace: ${{ steps.pick.outputs.namespace }}
      host:      ${{ steps.pick.outputs.host }}
      registry:  ${{ steps.pick.outputs.registry }}
      tag:       ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ inputs.environment }}"
          elif [ "${{ github.ref_name }}" = "prod" ]; then
            ENV="prod"
          else
            ENV="dev"
          fi
          if [ "$ENV" = "prod" ]; then
            echo "namespace=restaurantos-prod"              >> "$GITHUB_OUTPUT"
            echo "host=restaurantos.softxlogic.com"         >> "$GITHUB_OUTPUT"
          else
            echo "namespace=restaurantos-dev"               >> "$GITHUB_OUTPUT"
            echo "host=dev.restaurantos.softxlogic.com"     >> "$GITHUB_OUTPUT"
          fi
          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase in a repository path; owner names may contain it.
          echo "registry=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "→ $ENV / ${GITHUB_SHA::12}"

  backend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Build all jars (one reactor pass)
        run: mvn -B -DskipTests -Dmaven.test.skip=true package

      - name: Fail if any module produced no bootable jar
        # A Spring Boot repackage that silently does not run leaves a ~300KB jar
        # with no BOOT-INF. It builds, it ships, it binds its port, and it serves
        # nothing. Catch it here rather than in a CrashLoopBackOff at 2am.
        run: |
          fail=0
          while IFS=: read -r name port dir; do
            jar=$(ls "$dir"/target/"$name"-*.jar 2>/dev/null | head -1)
            if [ -z "$jar" ]; then echo "::error::$name produced no jar"; fail=1; continue; fi
            n=$(unzip -l "$jar" | grep -c 'BOOT-INF/' || true)
            if [ "$n" -lt 10 ]; then echo "::error::$name jar has no BOOT-INF ($n entries) — repackage did not run"; fail=1; fi
            printf '  %-26s %8s KB  BOOT-INF entries: %s\n' "$name" "$(( $(stat -c%s "$jar") / 1024 ))" "$n"
          done < deploy/k8s-modules.txt
          exit $fail

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push 18 images
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          while IFS=: read -r name port dir; do
            img="$REGISTRY/restaurantos-$name"
            echo "::group::$name"
            docker build -q -f "$dir/Dockerfile.ci" -t "$img:$TAG" -t "$img:${{ needs.setup.outputs.env }}" "$dir"
            docker push -q "$img:$TAG"
            docker push -q "$img:${{ needs.setup.outputs.env }}"
            echo "::endgroup::"
          done < deploy/k8s-modules.txt

  frontend:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push frontend
        # NEXT_PUBLIC_* is compiled in, so this image is environment-specific —
        # see frontend/Dockerfile.ci for why it cannot be made relative.
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          TAG: ${{ needs.setup.outputs.tag }}
          HOST: ${{ needs.setup.outputs.host }}
        run: |
          img="$REGISTRY/restaurantos-frontend"
          docker build -f frontend/Dockerfile.ci \
            --build-arg NEXT_PUBLIC_API_BASE_URL="https://$HOST" \
            --build-arg NEXT_PUBLIC_WS_BASE_URL="wss://$HOST" \
            -t "$img:$TAG" -t "$img:${{ needs.setup.outputs.env }}" frontend
          docker push -q "$img:$TAG"
          docker push -q "$img:${{ needs.setup.outputs.env }}"

  deploy:
    needs: [setup, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pin every image to this commit
        env:
          REGISTRY: ${{ needs.setup.outputs.registry }}
          TAG: ${{ needs.setup.outputs.tag }}
        working-directory: deploy/k8s/overlays/${{ needs.setup.outputs.env }}
        run: |
          curl -sfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz | tar xz
          while IFS=: read -r name port dir; do
            ./kustomize edit set image "restaurantos/$name=$REGISTRY/restaurantos-$name:$TAG"
          done < ../../../../deploy/k8s-modules.txt
          ./kustomize edit set image "restaurantos/frontend=$REGISTRY/restaurantos-frontend:$TAG"
          ./kustomize build . > /tmp/manifests.yaml
          echo "rendered $(grep -c '^kind:' /tmp/manifests.yaml) objects"

      - name: Open SSH to the VPS
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Refresh the GHCR pull secret
        # The kubelet pulls images long after this job ends (any pod restart,
        # eviction or node reboot), so it cannot use the job's ephemeral
        # GITHUB_TOKEN — that expires with the run and the next restart would
        # ImagePullBackOff. A read:packages PAT is what makes restarts survive.
        env: { NS: "${{ needs.setup.outputs.namespace }}" }
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            k3s kubectl -n $NS delete secret ghcr --ignore-not-found >/dev/null
            k3s kubectl -n $NS create secret docker-registry ghcr \
              --docker-server=ghcr.io \
              --docker-username='${{ github.actor }}' \
              --docker-password='${{ secrets.GHCR_PULL_TOKEN }}' >/dev/null
            k3s kubectl -n $NS patch serviceaccount default \
              -p '{\"imagePullSecrets\":[{\"name\":\"ghcr\"}]}' >/dev/null
            echo '  pull secret refreshed'
          "

      - name: Apply
        env: { NS: "${{ needs.setup.outputs.namespace }}" }
        run: |
          scp -o StrictHostKeyChecking=yes /tmp/manifests.yaml \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/manifests-$NS.yaml
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            k3s kubectl -n $NS apply -f /tmp/manifests-$NS.yaml
          "

      - name: Wait for every rollout, and print the truth if one fails
        env: { NS: "${{ needs.setup.outputs.namespace }}" }
        run: |
          ssh -o StrictHostKeyChecking=yes ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            set -u; failed=0
            for d in \$(k3s kubectl -n $NS get deploy -o name); do
              if ! k3s kubectl -n $NS rollout status \$d --timeout=8m; then
                failed=1
                echo \"::error::\$d did not roll out\"
                k3s kubectl -n $NS describe \$d | tail -25
                k3s kubectl -n $NS logs \$d --tail=60 --all-containers 2>/dev/null || true
              fi
            done
            echo; k3s kubectl -n $NS get pods -o wide
            exit \$failed
          "

      - name: Smoke-test the deployed environment
        # A green rollout means the containers started. It does not mean the site
        # answers. This is the only step that tests what a user actually touches.
        #
        # WHAT IT ASSERTS, and why not the obvious thing:
        #   /login must be 200. NOT "/" — that legitimately 307s to /login, and an
        #     earlier version of this step demanded 200 from it and failed a deploy
        #     that had worked perfectly. The gate was wrong, not the app.
        #   /api/... must be 4xx. Every API route here requires authentication, so
        #     401 is the CORRECT answer and proves the gateway is routing and its
        #     auth filter is running. 5xx or 000 would mean the gateway is down —
        #     that is the real failure this catches.
        env: { HOST: "${{ needs.setup.outputs.host }}" }
        run: |
          for i in $(seq 1 20); do
            login=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOST/login" || echo 000)
            api=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$HOST/api/v1/auth/health" || echo 000)
            echo "  attempt $i: /login=$login  /api=$api"
            if [ "$login" = "200" ] && [ "${api:0:1}" = "4" ]; then
              echo "SMOKE PASS — frontend serving, gateway up and enforcing auth"
              exit 0
            fi
            sleep 15
          done
          echo "::error::smoke test failed — /login=$login (want 200), /api=$api (want 4xx)"
          exit 1
