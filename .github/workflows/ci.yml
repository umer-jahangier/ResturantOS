name: CI

# INFRA-05 / SC4: lint -> test -> build(signed) -> schema-sync as a single automated
# pipeline with NO manual intervention in the core path. The only manual gate is
# promote-to-prod (environment: production), which is a deliberate GitHub approval
# BY DESIGN (D6, spec D1.4) and is NOT part of the automated core.
on:
  pull_request: {}
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "22"
  OPA_VERSION: "1.17.0"

jobs:
  # ---------------------------------------------------------------------------
  # lint: Java static analysis + frontend eslint/prettier/tsc (FE-08 enforced in CI)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Java static analysis + frontend eslint/prettier/tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Java static analysis. checkstyle/spotbugs/pmd are NOT yet wired into the
      # parent POM (gap documented in 04-03-SUMMARY); we run what exists — a clean
      # compile across all modules — which fails the job on any compilation error.
      # Once the analysis plugins are wired, replace this with the dedicated goals:
      #   mvn -B -ntp checkstyle:check spotbugs:check pmd:check
      - name: Java static analysis (compile + any wired analysis)
        run: mvn -B -ntp -DskipTests verify

      # Guard against the defect class that silently broke every multi-stage image:
      # each self-building Dockerfile COPYs the reactor's module POMs one line at a
      # time, and Maven validates EVERY <module> declared in the parent pom even under
      # -pl/-am. Adding a module to pom.xml without adding the matching COPY line makes
      # the image fail with "Child module ... does not exist" — but only at image-build
      # time, long after the PR that caused it merged. Fail fast in lint instead.
      - name: Dockerfile reactor-POM lists must cover every module
        run: |
          python3 - <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          NS = "{http://maven.apache.org/POM/4.0.0}"
          modules = [m.text.strip() for m in ET.parse("pom.xml").getroot().find(NS + "modules")]
          copy_re = re.compile(r"^COPY (\S+)/pom\.xml \1/pom\.xml$", re.M)
          failures = []
          for df in sorted(glob.glob("*/Dockerfile") + glob.glob("services/*/Dockerfile")):
              body = open(df).read()
              have = set(copy_re.findall(body))
              if not have:
                  print(f"[skip] {df}: slim runtime image (no reactor POM list)")
                  continue
              missing = [m for m in modules if m not in have]
              print(f"[{'FAIL' if missing else 'OK'}] {df}: {len(have)}/{len(modules)} module POMs")
              if missing:
                  failures.append(f"{df} is missing COPY lines for: {', '.join(missing)}")
          if failures:
              print("\nStale Dockerfile reactor POM lists:\n  " + "\n  ".join(failures))
              print("Add the missing 'COPY <module>/pom.xml <module>/pom.xml' lines.")
              sys.exit(1)
          PY

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node ${{ env.NODE_VERSION }} + pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: ESLint (FE-08 layer-boundary; a skip-layer import fails)
        run: pnpm --dir frontend run lint

      - name: Prettier --check
        run: pnpm --dir frontend run format:check

      - name: tsc --noEmit (zero any)
        run: pnpm --dir frontend exec tsc --noEmit

      # print-agent is a THIRD workspace, alongside the Maven reactor and frontend/,
      # and nothing in this file knew it existed. Its 84 tests ran only if a person
      # happened to `cd print-agent` — so the ESC/POS renderer, the durable queue and
      # the transports were, from CI's point of view, unprotected against regression
      # by anyone who didn't know to look there.
      #
      # `test` AND `typecheck`, not just `test`. Vitest does not typecheck, and that is
      # not hypothetical here: this package twice had a green `npm test` sitting on top
      # of a `tsc --noEmit` failure (a TS4115 override error in the transport, and three
      # type errors in the daemon spec). A suite that passes while the package does not
      # compile is worse than no suite, because it reports confidence it has not earned.
      - name: Install print-agent dependencies
        run: pnpm --dir print-agent install --frozen-lockfile

      - name: print-agent tsc --noEmit
        run: pnpm --dir print-agent run typecheck

      - name: print-agent tests
        run: pnpm --dir print-agent run test

  # ---------------------------------------------------------------------------
  # test: data-driven per-area coverage gates (Java + frontend + OPA)
  #   finance/inventory >= 75, all other Java modules + frontend (Vitest) >= 60,
  #   OPA == 100. Thresholds are read from coverage-gates.json (Pitfall 9) so later
  #   phases raise gates WITHOUT editing this workflow.
  # ---------------------------------------------------------------------------
  test:
    name: Test (data-driven coverage gates)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin) + Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # JUnit5 + Testcontainers. The GitHub-hosted runner has a working Docker
      # daemon (no Colima/Ryuk quirk), so Testcontainers runs unmodified.
      - name: Java tests + JaCoCo (mvn -Pcoverage verify)
        run: mvn -B -ntp -Pcoverage verify

      - name: Generate JaCoCo CSV reports
        run: mvn -B -ntp -Pcoverage org.jacoco:jacoco-maven-plugin:0.8.14:report

      # Data-driven per-module gate: parse each module's jacoco.csv and compare its
      # LINE coverage to the gate from coverage-gates.json (per-path override else
      # the java.default). finance/inventory entries are forward-declared (Phases 6/8).
      - name: Enforce Java per-module coverage gates
        run: |
          python3 - <<'PY'
          import csv, glob, json, sys, os
          gates = json.load(open(".github/workflows/coverage-gates.json"))["java"]
          default = gates["default"]
          failures = []
          csvs = glob.glob("**/target/site/jacoco/jacoco.csv", recursive=True)
          if not csvs:
              print("No jacoco.csv reports found — nothing to gate.")
          for path in csvs:
              module = path.split("/target/")[0]
              gate = gates.get(module, default)
              covered = missed = 0
              with open(path) as fh:
                  for row in csv.DictReader(fh):
                      covered += int(row["LINE_COVERED"])
                      missed += int(row["LINE_MISSED"])
              total = covered + missed
              pct = (covered / total * 100) if total else 100.0
              status = "OK" if pct >= gate else "FAIL"
              print(f"[{status}] {module}: {pct:.2f}% (gate {gate}%)")
              if pct < gate:
                  failures.append(f"{module}: {pct:.2f}% < {gate}%")
          if failures:
              print("Coverage gate failures:\n  " + "\n  ".join(failures))
              sys.exit(1)
          PY

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node ${{ env.NODE_VERSION }} + pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # Vitest coverage thresholds are enforced by frontend/vitest.config.ts, which
      # mirrors the "frontend" gate (60) in coverage-gates.json — the source of truth.
      - name: Frontend tests + coverage (Vitest, gate >= frontend)
        run: |
          FRONTEND_GATE=$(python3 -c "import json;print(json.load(open('.github/workflows/coverage-gates.json'))['frontend'])")
          echo "frontend coverage gate (coverage-gates.json) = ${FRONTEND_GATE}%"
          pnpm --dir frontend run test:coverage

      - name: Install OPA ${{ env.OPA_VERSION }}
        run: |
          curl -fsSL -o /usr/local/bin/opa \
            "https://openpolicyagent.org/downloads/v${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version

      # OPA must be EXACTLY 100% policy coverage (SC4). Parse the JSON coverage field.
      - name: OPA policy tests (coverage must == 100)
        run: |
          opa test policies/ --coverage --format json > opa-coverage.json
          python3 - <<'PY'
          import json, sys
          cov = json.load(open("opa-coverage.json")).get("coverage")
          print(f"OPA coverage: {cov}%")
          if cov is None or float(cov) < 100.0:
              print("OPA policy coverage gate FAILED — must be exactly 100%.")
              sys.exit(1)
          PY

  # ---------------------------------------------------------------------------
  # schema-sync: typecheck the Zod schemas + best-effort OpenAPI<->Zod drift (D5).
  #   (a) tsc --noEmit confirms frontend/lib/api-client/schemas/** typecheck.
  #   (b) A maintained OpenAPI<->Zod diff tool was verified absent on npm at
  #       execution time (`openapi-to-zod-check` -> 404), so we ship a documented
  #       placeholder; the backend SpringDoc OpenAPI is a Phase-3+ dependency.
  # ---------------------------------------------------------------------------
  schema-sync:
    name: Schema sync (Zod typecheck + OpenAPI drift placeholder)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node ${{ env.NODE_VERSION }} + pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck Zod schemas (frontend/lib/api-client/schemas/**)
        run: pnpm --dir frontend exec tsc --noEmit -p tsconfig.json

      - name: OpenAPI<->Zod drift check (D5b placeholder)
        run: |
          echo "schema-sync: OpenAPI<->Zod cross-repo diff deferred — backend SpringDoc OpenAPI is a Phase-3+ dependency."
          echo "(No maintained OpenAPI<->Zod diff tool verified on npm at execution time: openapi-to-zod-check -> 404.)"

  # ---------------------------------------------------------------------------
  # build: cosign-signed multi-arch (amd64+arm64) GHCR images (SC4, Pitfall 10).
  #   On pull_request: build WITHOUT push/sign (validate Dockerfiles only — keeps the
  #   core path green without registry creds on forks). On push/tags: push + sign.
  # ---------------------------------------------------------------------------
  build:
    name: Build & sign image (${{ matrix.image.name }})
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless OIDC
    strategy:
      fail-fast: false
      matrix:
        # EVERY deployable in the reactor must appear here. Two Dockerfile styles are
        # in play and the `context` differs per style — do not "normalise" it:
        #   * context "."            -> self-building multi-stage Dockerfile; Maven runs
        #                               INSIDE the image, so the repo root must be the context.
        #   * context services/<svc> -> slim runtime Dockerfile that COPYs target/<svc>-*.jar;
        #                               the jar is produced by the "Pre-build jars" step below.
        # notification-service is deliberately ABSENT: it has zero source files and
        # produces no artifact by design — see services/notification-service/README.md.
        image:
          - { name: eureka-server, context: ".", dockerfile: eureka-server/Dockerfile }
          - { name: config-server, context: ".", dockerfile: config-server/Dockerfile }
          - { name: auth-service, context: ".", dockerfile: services/auth-service/Dockerfile }
          - { name: authorization-service, context: ".", dockerfile: services/authorization-service/Dockerfile }
          - { name: gateway, context: ".", dockerfile: gateway/Dockerfile }
          - { name: user-service, context: ".", dockerfile: services/user-service/Dockerfile }
          - { name: platform-admin-service, context: ".", dockerfile: services/platform-admin-service/Dockerfile }
          - { name: audit-service, context: ".", dockerfile: services/audit-service/Dockerfile }
          - { name: file-service, context: ".", dockerfile: services/file-service/Dockerfile }
          - { name: finance-service, context: ".", dockerfile: services/finance-service/Dockerfile }
          - { name: purchasing-service, context: ".", dockerfile: services/purchasing-service/Dockerfile }
          - { name: pos-service, context: ".", dockerfile: services/pos-service/Dockerfile }
          - { name: kitchen-service, context: ".", dockerfile: services/kitchen-service/Dockerfile }
          - { name: crm-service, context: services/crm-service, dockerfile: services/crm-service/Dockerfile }
          - { name: hr-service, context: services/hr-service, dockerfile: services/hr-service/Dockerfile }
          - { name: inventory-service, context: services/inventory-service, dockerfile: services/inventory-service/Dockerfile }
          - { name: nlq-service, context: services/nlq-service, dockerfile: services/nlq-service/Dockerfile }
          - { name: reporting-service, context: services/reporting-service, dockerfile: services/reporting-service/Dockerfile }
          - { name: frontend, context: frontend, dockerfile: frontend/Dockerfile }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/restaurantos-${{ matrix.image.name }}
      # Push (and therefore sign) on everything except pull_request validation builds.
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # Slim-runtime images (context services/<svc>) COPY a pre-built target/<svc>-*.jar
      # instead of running Maven inside the image. Build that jar here — natively, once —
      # rather than under QEMU twice. Multi-stage images (context ".") skip this step.
      - name: Set up JDK ${{ env.JAVA_VERSION }} (Temurin) + Maven cache
        if: startsWith(matrix.image.context, 'services/')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Pre-build jar for slim runtime image
        if: startsWith(matrix.image.context, 'services/')
        run: |
          mvn -B -ntp -DskipTests -pl "${{ matrix.image.context }}" -am package
          ls -l "${{ matrix.image.context }}/target/"*.jar

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags ({sha}, {semver}, {branch}-latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}-latest,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: Build (+ push on non-PR) multi-arch image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Install cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@v3

      # Keyless OIDC signing of the pushed digest (Pitfall 10).
      - name: Sign image (cosign keyless OIDC)
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # ---------------------------------------------------------------------------
  # e2e: Playwright scaffold + ONE smoke journey (D6/W1). Non-blocking: the full
  #   ~50-journey suite runs against STAGING and spans every later phase — it is
  #   explicitly NOT a Phase-4 deliverable.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E smoke (Playwright scaffold)
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true # scaffold only; full staging suite is cross-phase
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node ${{ env.NODE_VERSION }} + pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Typecheck E2E sources (isolated e2e/tsconfig.json)
        run: pnpm --dir frontend exec tsc --noEmit -p e2e/tsconfig.json

      - name: Install Playwright browser (chromium)
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run Playwright smoke
        run: pnpm --dir frontend run e2e

  # ---------------------------------------------------------------------------
  # browser-e2e: the browser journey harness (frontend/e2e/journeys).
  #
  #   WHAT RUNS HERE AND WHAT DOES NOT, and why.
  #
  #   The journey suite drives a REAL browser against a REAL stack: gateway, auth, user,
  #   platform-admin, pos, kitchen, inventory, purchasing, finance and reporting, plus
  #   PostgreSQL, Redis, RabbitMQ, Eureka and ClickHouse, seeded with 19 principals. That is
  #   not something a pull-request job can stand up, and pretending otherwise produces a job
  #   that is either permanently red or permanently skipped.
  #
  #   So CI runs the two halves that ARE meaningful without a stack:
  #     1. TYPECHECK the harness. The specs are TypeScript against the app's own types and
  #        fixtures; a renamed testid, a changed persona shape or a dropped export breaks
  #        compilation. This is what catches harness rot between stack runs.
  #     2. The backend-free SMOKE project.
  #
  #   The full suite is opt-in: set the repository variable E2E_STACK_URL to a reachable
  #   stack and this job runs the journeys against it. Until then that step is skipped, and
  #   it says so rather than reporting a false green.
  #
  #   `needs: [lint]` — parallel with test/build, so it never lengthens the critical path.
  # ---------------------------------------------------------------------------
  browser-e2e:
    name: Browser E2E harness (typecheck + smoke)
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Set up Node ${{ env.NODE_VERSION }} + pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      # The real regression gate for this harness. NOT continue-on-error: a journey suite
      # that no longer compiles is broken whether or not a stack is available to run it.
      - name: Typecheck the E2E harness
        run: pnpm --dir frontend run e2e:typecheck

      - name: Lint the E2E harness
        run: pnpm --dir frontend exec eslint e2e

      - name: Install Playwright browser (chromium)
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Backend-free smoke
        run: bash scripts/e2e/browser-e2e.sh --smoke

      - name: Full journey suite (only when a live stack is configured)
        if: ${{ vars.E2E_STACK_URL != '' }}
        env:
          PLAYWRIGHT_BASE_URL: ${{ vars.E2E_STACK_URL }}
          E2E_GATEWAY_URL: ${{ vars.E2E_GATEWAY_URL }}
          # Behind a proxy that rewrites X-Forwarded-For the per-worker rate-limit
          # isolation cannot work; raise RATE_LIMIT_AUTH_PER_MIN on that stack instead.
          E2E_WORKER_IP: "0"
        run: bash scripts/e2e/browser-e2e.sh

      - name: Report why the journey suite was skipped
        if: ${{ vars.E2E_STACK_URL == '' }}
        run: |
          echo "::notice title=Journey suite not run::E2E_STACK_URL is unset, so the browser"
          echo "journey suite did not run. It needs a seeded, live stack. The harness was"
          echo "typechecked and linted, and the backend-free smoke ran. To enable: set the"
          echo "E2E_STACK_URL and E2E_GATEWAY_URL repository variables."

  # ---------------------------------------------------------------------------
  # deploy-prod: PLACEHOLDER — the promote-to-prod gate is a DELIBERATE manual
  #   GitHub `environment: production` approval BY DESIGN (D6, spec D1.4). It is NOT
  #   part of the automated core (lint -> test -> build -> schema-sync) and performs
  #   NO real deploy here; the actual helm promotion lands in a later infra phase.
  # ---------------------------------------------------------------------------
  deploy-prod:
    name: Promote to production (manual approval placeholder)
    needs: [build, schema-sync]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # GitHub manual approval gate (by design)
    steps:
      - name: Promotion placeholder
        run: echo "Manual production promotion gate — real helm promote is a later-phase deliverable (D6)."
