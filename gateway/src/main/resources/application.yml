server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    # shared-lib transitively pulls in spring-boot-starter-web (servlet); force the
    # reactive context so Spring Cloud Gateway (WebFlux) loads without the
    # servlet/reactive security bean clash (conversionServicePostProcessor).
    web-application-type: reactive
  application:
    name: gateway

  # Reactive Redis for RequestRateLimiter (Lua token-bucket) + feature-flag cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # shared-lib transitively pulls in spring-boot-starter-amqp (RabbitHealthIndicator
  # etc.). Without this block Spring Boot's RabbitAutoConfiguration falls back to its
  # hardcoded localhost/guest/guest defaults, which the "restaurantos" vhost user in
  # docker-compose does not have (the definitions.json replaces the guest account) —
  # every connection attempt then fails with ACCESS_REFUSED regardless of the
  # RABBITMQ_HOST/USERNAME/PASSWORD env vars being set correctly.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

  cloud:
    gateway:
      server:
        webflux:
          # Pitfall 2: X-Forwarded-* is disabled by default in SC 2025.1.0.
          # Trust Nginx (docker-compose internal network is 172.x.x.x).
          trusted-proxies: "127\\.0\\.0\\.1|::1|172\\..*"

          default-filters:
            # The gateway sets CORS at the edge (GatewaySecurityConfig) AND each downstream
            # service also sets CORS, so proxied responses carry two identical
            # Access-Control-Allow-* headers. Browsers reject multiple values, so collapse
            # duplicates to a single value here. RETAIN_UNIQUE keeps one entry per unique value.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
            # X-Internal-Service stripping is handled by StripInternalHeaderFilter (GlobalFilter)
            # so it applies to ALL routes (YAML + programmatic). See §4.1 enforcement note.
            # General-tier rate limiter: ~600 req/min per IP
            # replenishRate=10 tokens/sec, burstCapacity=600 (initial burst)
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: ${RATE_LIMIT_API_PER_MIN:600}
                key-resolver: "#{@ipKeyResolver}"

          # Every route's CircuitBreaker filter below lists `statusCodes: [503]` only — 500 was
          # removed from all ten. With 500 included, Spring Cloud Gateway rewrites the FIRST
          # matching response into the generic fallback body, regardless of whether the breaker
          # is actually open: a backend returning one well-formed 500 (its own ApiError JSON, real
          # code and message) had that body discarded and replaced with
          # `{"code":"SERVICE_UNAVAILABLE","message":"...temporarily unavailable..."}` — identical
          # wording whether the backend was down or just answered one ordinary request-level error
          # (e.g. a uniqueness conflict a service hadn't yet turned into a proper 4xx). The
          # backend's own 500 handler already logs a traceId for genuine bugs; masking its body at
          # the edge only cost diagnosability, on every route, for every 500, always.
          # A 503 is different: it's a service's OWN "I am deliberately unavailable" signal, so
          # folding it into the generic fallback is redundant, not lossy — see e.g.
          # inventory-service's FinanceUnavailableException. An unreachable/connection-refused
          # upstream still trips the breaker via the client exception path, not `statusCodes`, so
          # GatewayRoutingIT#circuitBreakerFallback_deadUpstream_returns503 is unaffected.
          routes:
            # ── Auth Service ────────────────────────────────────────────────────────
            - id: auth-route
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                # Tighter rate limit for auth endpoints: ~100 req/min per IP
                # replenishRate=2 tokens/sec, burstCapacity=100
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_PER_MIN:100}
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── JWKS public endpoint (served by auth-service) ────────────────────
            - id: jwks-route
              uri: lb://auth-service
              predicates:
                - Path=/.well-known/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable

            # ── Role & permission catalog (served by auth-service) ───────────────
            # D-14. Two authenticated reads a role picker cannot exist without; auth-service owns
            # the roles/permissions/role_permissions tables, so it serves them.
            #
            # A DEDICATED route rather than an extra prefix on auth-route, which is the escape
            # hatch 13-07-PLAN names. auth-route carries a deliberately tight per-IP budget
            # (replenishRate 2/s, burst RATE_LIMIT_AUTH_PER_MIN=100) because it fronts a credential
            # endpoint. That bucket is keyed on IP, and a restaurant's back office is one NAT'd IP,
            # so putting an admin page's catalog reads in it means catalog traffic spends LOGIN's
            # tokens. The failure that produces is not a slow picker — it is nobody in the building
            # being able to log in. These endpoints therefore take the general default-filters
            # budget (RATE_LIMIT_API_PER_MIN=600), which is still a limit, just not the credential
            # one.
            #
            # Same authCircuitBreaker as auth-route and jwks-route: the upstream IS auth-service and
            # its health is one fact, not three. Its 5s time limiter already covers a cold-JIT first
            # call.
            #
            # Declaration position is cosmetic here — neither predicate overlaps any other route, so
            # unlike platform-auth-route this one does not depend on being declared first.
            #
            # NOT in JwtGlobalFilter.PUBLIC_PATHS and NOT in TENANT_OPTIONAL_PATHS: both endpoints
            # require a tenant-bearing token. Asserted by RoleCatalogRouteTest.
            #
            # NOT in RouteFeatureMap either, deliberately. Role discovery is how a tenant administers
            # its own users; gating it on a module entitlement would mean a tier change could make
            # user administration unreachable (T-13-07-E). Same rationale as reporting-route.
            - id: role-catalog-route
              uri: ${AUTH_SERVICE_URI:lb://auth-service}
              # Both the bare path and the /** form are listed. PathPattern does treat `/foo/**`
              # as matching `/foo`, but these two endpoints ARE the bare paths — a routing rule
              # whose correctness rests on a subtlety of the matcher, for the only requests it will
              # ever serve, is not worth the two extra entries it costs to remove the question.
              predicates:
                - Path=/api/v1/roles, /api/v1/roles/**, /api/v1/permissions, /api/v1/permissions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Authorization Service ────────────────────────────────────────────
            - id: authorization-route
              uri: lb://authorization-service
              predicates:
                - Path=/api/v1/authorization/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authorizationCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Platform (SuperAdmin) login ──────────────────────────────────────
            # MUST stay declared BEFORE platform-admin-route. Spring Cloud Gateway evaluates routes
            # in declaration order and takes the first match, so declaration order IS the mechanism
            # that gives this path its own rate limit — /api/v1/platform/auth/login also matches
            # platform-admin-route's /api/v1/platform/** predicate, and whichever is declared first
            # wins. Moving this below it silently removes the throttle.
            #
            # The budget matches auth-route deliberately: this is a credential endpoint, and an
            # unthrottled one is threat T-13-01-BF. It is the control plane's credential endpoint at
            # that — a SuperAdmin password is worth more brute-force effort than any tenant user's.
            # The path is also in JwtGlobalFilter.PUBLIC_PATHS (no token exists yet at login), which
            # is exactly why the rate limiter is the only thing in front of it.
            #
            # 404s from platform-admin-service until 13-05 lands the endpoint. Declared here because
            # this plan owns the gateway files; a later plan editing them would serialise the waves.
            - id: platform-auth-route
              uri: lb://platform-admin-service
              predicates:
                - Path=/api/v1/platform/auth/login
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 2
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_AUTH_PER_MIN:100}
                    key-resolver: "#{@ipKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: platformAdminCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Platform Admin Service ───────────────────────────────────────────
            - id: platform-admin-route
              uri: lb://platform-admin-service
              predicates:
                - Path=/api/v1/platform/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: platformAdminCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── User Service ─────────────────────────────────────────────────────
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**, /api/v1/branches/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── File Service ──────────────────────────────────────────────────────
            - id: file-route
              uri: lb://file-service
              predicates:
                - Path=/api/v1/files/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: fileCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Feature Flags (public, tenant-scoped) — served by platform-admin ──
            # The frontend reads enabled FEATURE_* codes to decide which modules to
            # render. Authenticated by any tenant JWT (not SUPER_ADMIN). No feature
            # gate on this route itself (it IS the feature lookup).
            - id: feature-flags-route
              uri: lb://platform-admin-service
              predicates:
                - Path=/api/v1/feature-flags
              filters:
                - name: CircuitBreaker
                  args:
                    name: platformAdminCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Finance Service ───────────────────────────────────────────────────
            # Gated by FEATURE_FINANCE (RouteFeatureMap) — FeatureFlagGlobalFilter
            # enforces it before proxying. COA, journal entries, periods, GL.
            - id: finance-route
              uri: lb://finance-service
              predicates:
                - Path=/api/v1/finance/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: financeCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Purchasing Service ───────────────────────────────────────────────
            - id: purchasing-route
              uri: lb://purchasing-service
              predicates:
                - Path=/api/v1/purchasing/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: purchasingCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── POS Service ───────────────────────────────────────────────────────
            - id: pos-route
              uri: lb://pos-service
              predicates:
                - Path=/api/v1/pos/**, /api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: posCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Kitchen Service ───────────────────────────────────────────────────
            - id: kitchen-route
              uri: lb://kitchen-service
              predicates:
                - Path=/api/v1/kitchen/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: kitchenCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Inventory Service (Phase 8) ──────────────────────────────────────
            # Gated by FEATURE_INVENTORY (RouteFeatureMap) — FeatureFlagGlobalFilter
            # enforces it before proxying. Ingredients/UOM/opening-balance/receipts/
            # transfers/counts.
            - id: inventory-route
              uri: lb://inventory-service
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: inventoryCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── CRM Service ─────────────────────────────────────────────────────
            - id: crm-route
              uri: lb://crm-service
              predicates:
                - Path=/api/v1/crm/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: crmCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 503

            # ── HR Service ───────────────────────────────────────────────────────
            - id: hr-route
              uri: lb://hr-service
              predicates:
                - Path=/api/v1/hr/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: hrCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 500
                      - 503

            # ── HR device-authenticated attendance ingest (JWT-exempt, FEATURE_HR-gated) ──
            # No user JWT: hr-service's DeviceAuthResolver verifies the device token and derives
            # tenant/branch from the registry. Rate-limited per DEVICE (SN query param) so one
            # device cannot exhaust a branch's shared per-IP budget.
            - id: hr-iclock-route
              uri: lb://hr-service
              predicates:
                - Path=/iclock/**
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEVICE_PER_MIN:120}
                    key-resolver: "#{@deviceKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: hrCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503
            - id: hr-attendance-ingest-route
              uri: lb://hr-service
              predicates:
                - Path=/internal/attendance/ingest
              filters:
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_DEVICE_PER_MIN:120}
                    key-resolver: "#{@deviceKeyResolver}"
                - name: CircuitBreaker
                  args:
                    name: hrCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Reporting Service (reports, FBR, realtime dashboard WS) ──────────
            # No feature gate in RouteFeatureMap — reports are core for every ACTIVE tenant
            # (same rationale as pos-route). Do NOT add /api/v1/reporting/ to RouteFeatureMap:
            # FEATURE_REPORTING_ADVANCED is GROWTH-and-above only, so gating this path would 403
            # every STARTER tenant out of basic reporting. Spring Cloud Gateway proxies the WS
            # upgrade transparently over the same Path predicate (as kitchen-route does for KDS).
            - id: reporting-route
              uri: lb://reporting-service
              predicates:
                - Path=/api/v1/reporting/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: reportingCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── NLQ Service (natural-language query → validated read-only SQL) ───
            # Feature-gated on FEATURE_NLQ (GROWTH+) in RouteFeatureMap. The flag is now defined
            # in TierFeatureDefaults (it was previously a phantom flag that 403'd every request).
            - id: nlq-route
              uri: lb://nlq-service
              predicates:
                - Path=/api/v1/nlq/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: nlqCircuitBreaker
                    fallbackUri: forward:/fallback/service-unavailable
                    statusCodes:
                      - 503

            # ── Feature-flagged routes (later phases) — commented stubs ──────────
            # - id: hr-route
            #   uri: lb://hr-service
            #   predicates:
            #     - Path=/api/v1/hr/**
            #   filters:
            #     - name: CircuitBreaker
            #       args:
            #         name: hrCircuitBreaker
            #         fallbackUri: forward:/fallback/service-unavailable

    # Eureka: register with service discovery so other services can find the gateway
    netflix:
      eureka:
        client:
          service-url:
            defaultZone: ${EUREKA_URI:http://eureka-server:8761/eureka}
          fetch-registry: true
          register-with-eureka: true

# Actuator: expose health (public — listed in JwtGlobalFilter.isPublicPath) + prometheus
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Resilience4j circuit-breaker instances (one per upstream that exists in Phase 3)
# UPDATE: that comment is now four upstreams out of date. The rule going forward is: every
# instance name referenced by a `CircuitBreaker` filter anywhere in the routes list (or in
# default-filters) above MUST have a declaration here — GatewayResilienceConfigTest enforces it.
resilience4j:
  circuitbreaker:
    instances:
      authCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      authorizationCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      platformAdminCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      userCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      fileCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      financeCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      crmCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      hrCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      purchasingCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      posCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      kitchenCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      inventoryCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      # reporting-route and nlq-route arrived referencing these two names with NO instance
      # declared anywhere — exactly the drift GatewayResilienceConfigTest was written to catch,
      # and the same shape as the bug its docstring describes (route silently runs on
      # resilience4j defaults, then 503s persistently after an upstream restart).
      reportingCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      nlqCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  # Reactive Spring Cloud CircuitBreaker applies a 1s call timeout when no time limiter is
  # configured for an instance. purchasing/pos/kitchen/inventory are the four routes this phase
  # puts real traffic on for the first time (recursive category-tree read, batch ingredient-category
  # lookup up to 500 ids, recipe cost preview, spend-by-category analytics) and are the most likely
  # to exceed 1s on a cold JIT — which would otherwise count a merely-slow first call as a breaker
  # failure. Scoped to these four only: the six pre-existing instances are deliberately left on the
  # current default so no already-working route changes behaviour as a side effect of this plan.
  timelimiter:
    instances:
      purchasingCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      posCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      kitchenCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      inventoryCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      # Reporting aggregates over ClickHouse fact tables; same class of work as the four above.
      reportingCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      # NLQ is the one route where the 1s default is not merely tight but guaranteed to fail:
      # a single request makes TWO Anthropic calls (SQL generation, then narrative) and then runs
      # the generated query, which nlq-service itself caps at NLQ_TIMEOUT_SECONDS=5. 30s leaves
      # the service's own timeout as the binding constraint rather than the gateway's.
      nlqCircuitBreaker:
        timeoutDuration: 30s
        cancelRunningFuture: true
      # The remaining six were previously left on the 1s reactive default on the reasoning that
      # they were "already working" and should not change behaviour as a side effect. Measured
      # against the running stack after the phase-12 merge, that premise does not hold: the FIRST
      # authenticated call to user / file / finance / crm each returned the generic
      # SERVICE_UNAVAILABLE fallback, and login through the gateway failed intermittently while
      # succeeding directly against auth-service on :8081 at 0.49-1.00s — straddling the 1s budget.
      # bcrypt is deliberately expensive and the first request additionally pays JIT plus
      # connection-pool warm-up, so 1s was never a safe budget for a login endpoint; auth-route is
      # also the one route whose failure blocks every other flow, since nothing else gets a token.
      # 5s matches the six above and only widens the window: a call that used to be cut off at 1s
      # now has room to answer, and a genuinely dead upstream still trips the breaker through the
      # connection-refused path rather than through this timeout.
      authCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      authorizationCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      platformAdminCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      userCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      fileCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      financeCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      crmCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true
      # hr-route + the two device-ingest routes all run on hrCircuitBreaker; give it the same 5s
      # budget as the others so a cold-JIT first call (payroll compute, device handshake) isn't
      # cut off at the 1s reactive default.
      hrCircuitBreaker:
        timeoutDuration: 5s
        cancelRunningFuture: true

# Gateway-specific properties
restaurantos:
  jwks:
    uri: ${JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
  platform-admin:
    # platform-admin-service listens on 8096. (8083 is authorization-service — pointing this
    # at 8083 makes every internal lookup fail, which the feature filter reads as "no features".)
    uri: ${PLATFORM_ADMIN_URI:http://127.0.0.1:8096}
  internal:
    # Shared secret for /internal/** calls; must match platform-admin's INTERNAL_SERVICE_SECRET.
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  # fail-open-on-platform-down: when true (dev profile), treat tenant as ACTIVE with no
  # feature restrictions when platform-admin-service is unreachable. NEVER set true in prod.
  fail-open-on-platform-down: ${FAIL_OPEN_ON_PLATFORM_DOWN:false}

logging:
  level:
    io.restaurantos.gateway: ${LOG_LEVEL_GATEWAY:INFO}
    org.springframework.cloud.gateway: ${LOG_LEVEL_SCG:WARN}
