apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: restaurantos-prod
resources:
  - ../../base
  - ingress.yaml
commonLabels:
  restaurantos.io/env: prod
# Image names are rewritten by CI (kustomize edit set image) to the GHCR digest
# of the commit being deployed. The :latest here is a placeholder that CI always
# replaces — it is never what actually runs.
images: []

# LIQUIBASE_CONTEXTS decides whether the 19 changesets tagged context="seed" run.
# Leaving it UNSET is not neutral: Liquibase runs ALL changesets when no context
# is given, which is how prod ended up with the demo tenant and demo logins.
# prod runs NO seed changesets — see deploy/k8s/README.md
patches:
  - target: { kind: ConfigMap, name: restaurantos-config }
    patch: |-
      - op: add
        path: /data/LIQUIBASE_CONTEXTS
        value: "prod"
  - target: { kind: ConfigMap, name: restaurantos-config }
    patch: |-
      - op: replace
        path: /data/CORS_ALLOWED_ORIGINS
        value: "https://restaurantos.softxlogic.com,https://*.restaurantos.io,http://localhost:3000"
