apiVersion: v1
kind: Service
metadata:
  name: authorization-service
  labels: { app: authorization-service }
spec:
  selector: { app: authorization-service }
  ports: [{ name: http, port: 8083, targetPort: 8083 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
  labels: { app: authorization-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: authorization-service } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: authorization-service, tier: app }
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres 5432 && nc -z eureka-server 8761; do echo waiting for postgres+eureka; sleep 3; done"]
          resources: { requests: { memory: "8Mi", cpu: "10m" }, limits: { memory: "32Mi" } }
      containers:
        - name: authorization-service
          image: restaurantos/authorization-service:latest
          ports: [{ containerPort: 8083, name: http }]
          envFrom:
            - configMapRef: { name: restaurantos-config }
            - secretRef:    { name: restaurantos-secrets }
          env:
            - { name: SERVER_PORT, value: "8083" }
            - { name: DB_HOST, value: "postgres" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "auth_db" }
            - { name: DB_USER, value: "auth_user" }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: restaurantos-secrets, key: AUTH_DB_PASSWORD } } }
          resources:
            requests: { memory: "200Mi", cpu: "50m" }
            limits:   { memory: "560Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8083 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8083 }
            periodSeconds: 20
            failureThreshold: 6
