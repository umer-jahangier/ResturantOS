apiVersion: v1
kind: Service
metadata:
  name: finance-service
  labels: { app: finance-service }
spec:
  selector: { app: finance-service }
  ports: [{ name: http, port: 8086, targetPort: 8086 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-service
  labels: { app: finance-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: finance-service } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: finance-service, tier: app }
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres 5432 && nc -z eureka-server 8761; do echo waiting for postgres+eureka; sleep 3; done"]
          resources: { requests: { memory: "8Mi", cpu: "10m" }, limits: { memory: "32Mi" } }
      containers:
        - name: finance-service
          image: restaurantos/finance-service:latest
          ports: [{ containerPort: 8086, name: http }]
          envFrom:
            - configMapRef: { name: restaurantos-config }
            - secretRef:    { name: restaurantos-secrets }
          env:
            - { name: SERVER_PORT, value: "8086" }
            - { name: FINANCE_DB_URL, value: "jdbc:postgresql://postgres:5432/finance_db" }
            - { name: FINANCE_DB_USER, value: "finance_user" }
            - { name: FINANCE_DB_PASSWORD, valueFrom: { secretKeyRef: { name: restaurantos-secrets, key: FINANCE_DB_PASSWORD } } }
          resources:
            requests: { memory: "300Mi", cpu: "50m" }
            limits:   { memory: "640Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8086 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8086 }
            periodSeconds: 20
            failureThreshold: 6
