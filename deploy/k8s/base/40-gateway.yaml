apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: gateway, tier: app }
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ["sh","-c","until nc -z eureka-server 8761 && nc -z redis 6379; do echo waiting for eureka+redis; sleep 3; done"]
          resources: { requests: { memory: "8Mi", cpu: "10m" }, limits: { memory: "32Mi" } }
      containers:
        - name: gateway
          image: restaurantos/gateway:latest
          ports: [{ containerPort: 8080, name: http }]
          envFrom:
            - configMapRef: { name: restaurantos-config }
            - secretRef:    { name: restaurantos-secrets }
          env:
            - { name: SERVER_PORT, value: "8080" }
            - { name: LOG_LEVEL_GATEWAY, value: "INFO" }
            - { name: FAIL_OPEN_ON_PLATFORM_DOWN, value: "false" }
          resources:
            requests: { memory: "200Mi", cpu: "50m" }
            limits:   { memory: "560Mi" }
          startupProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 8080 }
            periodSeconds: 20
            failureThreshold: 6
