server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: kitchen-service
  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8888}
  datasource:
    url: ${KITCHEN_DB_URL:jdbc:postgresql://localhost:5432/kitchen_db}
    username: ${KITCHEN_DB_USER:kitchen_user}
    password: ${KITCHEN_DB_PASSWORD:kitchen_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # AUTO (container-managed ack): ack on success, nack on exception. Was 'manual', but no
        # consumer ever called basicAck, so messages piled up unacked and redelivered forever — and
        # retry/DLQ never fired. AUTO + retry + default-requeue-rejected=false = success acks & clears,
        # failure retries then dead-letters to restaurantos.dlx (the <queue>.dlq bound in definitions).
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 8000
  cloud:
    config:
      uri: ${CONFIG_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  # Source of truth for @RequiresFeature checks — shared-lib resolves a feature-flag cache miss
  # from platform-admin (which owns tenant_features). Without it every gated endpoint 403s.
  platform-admin:
    uri: ${PLATFORM_ADMIN_URI:http://127.0.0.1:8096}
  # Source of truth for the branch's STATION REGISTRY. pos-service owns station CRUD
  # (/app/stations); kds_stations is a projection of it, refreshed by StationRegistryService over
  # /internal/stations. Point this wrong and the KDS silently falls back to showing only stations
  # that have already received a ticket — PosStationClient logs a WARN naming the URL it tried, and
  # a branch with no projected stations answers 503 rather than "no stations configured".
  pos:
    uri: ${POS_SERVICE_URI:http://127.0.0.1:8084}
  # Source of truth for the BRANCH's IANA time zone, which is what the KDS "clear old tickets"
  # control cuts its business-day boundary on (F17). user-service owns branches. Point this wrong
  # and UserBranchClient logs a WARN naming the URL it tried, the preview falls back to
  # business-day.default-timezone and SAYS SO on screen, and the CLEAR refuses outright with a 503
  # rather than deciding what "yesterday" means on a zone nobody chose.
  user:
    uri: ${USER_SERVICE_URI:http://127.0.0.1:8082}
  business-day:
    # The SAME two properties pos-service and reporting-service read. A tenant that moves its
    # trading-day boundary must move it for all three or the kitchen, the ledger and the reports
    # start disagreeing about which day a thing happened on — which has already happened here once.
    offset-hours: ${BUSINESS_DAY_OFFSET_HOURS:4}
    default-timezone: ${BUSINESS_DAY_DEFAULT_TIMEZONE:Asia/Karachi}
    branch-timezone-cache-ttl-hours: ${BRANCH_TIMEZONE_CACHE_TTL_HOURS:24}
  jwks:
    uri: ${JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
  opa:
    url: ${OPA_URL}
