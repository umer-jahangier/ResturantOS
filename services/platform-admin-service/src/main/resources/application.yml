server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: platform-admin-service
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform_db}
    # platform_user, NOT platform_admin. deploy/init/02-create-roles.sql creates platform_user and
    # nothing in deploy/ has ever created platform_admin — so any deployment that does not set
    # PLATFORM_DB_USER explicitly (docker-compose does not) connected as a role that does not
    # exist. It survived only on machines where platform_admin had been created by hand at some
    # point, and there it caused the opposite failure: tables owned by platform_admin, service
    # connecting as platform_user, and the first migration to ALTER an existing table refusing to
    # start the service (found by 13-14's changeset 030-001).
    #
    # One identity end to end. scripts/local-service-env.sh already exports platform_user.
    username: ${PLATFORM_DB_USER:platform_user}
    password: ${PLATFORM_DB_PASSWORD:platform_admin_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  jwks:
    uri: ${JWKS_URI:http://auth-service/api/v1/auth/.well-known/jwks.json}
  feature-flag:
    cache-ttl-seconds: 300
  auth-service:
    uri: ${AUTH_SERVICE_URI:http://localhost:8081}
  user-service:
    uri: ${USER_SERVICE_URI:http://localhost:8082}
  finance-service:
    uri: ${FINANCE_SERVICE_URI:http://localhost:8086}
  # The cross-tenant audit read. audit-service listens on 8093 (its application.yml) and gates
  # /internal/** on X-Internal-Service-SECRET — a different header name from the one every other
  # internal seam here uses, which is why AuditPlatformClient carries its own Feign config.
  audit-service:
    uri: ${AUDIT_SERVICE_URI:http://localhost:8093}
  # System health. Probing an actuator is a real network call to a service that may be the one
  # that is down, so the timeout is short and configurable: a status page that hangs is a status
  # page nobody opens during an incident.
  health:
    probe-timeout-ms: ${PLATFORM_HEALTH_PROBE_TIMEOUT_MS:2000}
    # reporting-service refuses to boot unless its four ClickHouse fact tables exist
    # (ClickHouseSchemaGuard). Its discovery name is how the health surface finds it; if the name
    # changes, the ClickHouse tile must report UNKNOWN rather than quietly disappear.
    reporting-service-id: ${PLATFORM_HEALTH_REPORTING_SERVICE_ID:reporting-service}
  provisioning:
    seed-coa:
      enabled: ${PROVISIONING_SEED_COA_ENABLED:true}
  # The subscription sweep applies instructions operators ALREADY gave — scheduled plan changes and
  # cancellations reaching their effective date — and moves elapsed trials to TRIAL_ENDED.
  #
  # It deliberately does NOT roll renewal periods forward when current_period_end_at elapses:
  # advancing that date asserts that the tenant paid, and this product observes no payments. An
  # elapsed period surfaces as renewalOverdue on the register instead, and a human asserts the
  # renewal through POST /tenants/{id}/subscription/renew.
  #
  # Every apply re-reads and re-checks its own row inside its own transaction, so two replicas
  # sweeping at once is harmless; the Redis lease is an optimisation, not the control. Set
  # `cron: "-"` to disable the trigger while leaving the component callable (that is what the test
  # profile does), or `enabled: false` to make it a no-op entirely.
  subscription:
    sweep:
      enabled: ${PLATFORM_SUBSCRIPTION_SWEEP_ENABLED:true}
      cron: ${PLATFORM_SUBSCRIPTION_SWEEP_CRON:0 */15 * * * *}
