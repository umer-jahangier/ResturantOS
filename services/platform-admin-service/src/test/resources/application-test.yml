restaurantos:
  internal:
    secret: test-internal-secret
  jwks:
    uri: http://localhost:${wiremock.server.port:9999}/test-jwks
  # 13-10 / D-09: this key lives under the `restaurantos.` prefix, which is the prefix the service
  # actually binds and the one application.yml has always declared. It was previously set here
  # unprefixed, matching a @Value that bound nothing — so the property appeared to work in tests
  # and was inert in production, where the default of `true` always won.
  provisioning:
    seed-coa:
      enabled: false
  # "-" is Spring's own "never schedule this task" cron. The BEAN stays live and callable, which is
  # what SubscriptionLifecycleIT needs: it invokes sweep() directly to assert that the sweep does
  # NOT roll a renewal period forward. Setting `enabled: false` instead would make that assertion
  # vacuous — the method would return before doing anything and the test would pass for the wrong
  # reason. Disabling the TRIGGER (and not the code) also stops a 15-minute cron firing in the
  # middle of a test that has just back-dated a pending change.
  subscription:
    sweep:
      enabled: true
      cron: "-"
spring:
  jpa:
    hibernate:
      ddl-auto: none
  liquibase:
    contexts: seed
