server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: finance-service
  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8888}
  datasource:
    url: ${FINANCE_DB_URL:jdbc:postgresql://localhost:5432/finance_db}
    username: ${FINANCE_DB_USER:finance_user}
    password: ${FINANCE_DB_PASSWORD:finance_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # default-requeue-rejected=false is the load-bearing line. Without it Spring AMQP's
        # default of TRUE nacks a failed message back onto the head of the SAME queue with no
        # delay: the container immediately redelivers it, the handler throws again, and the
        # service spins at the speed of the broker round-trip. finance has ten @RabbitListeners
        # on money paths, so ANY handler failure — a JE_UNBALANCED reject, an unresolvable
        # account tag, a closed period — became a hot loop that pinned a core and starved every
        # other message on the queue behind the poison one.
        # FinanceRabbitConfig already gives every queue an x-dead-letter-exchange and a BOUND
        # DLQ, so with this set a poison message retries three times with backoff and then lands
        # somewhere a human can find it, instead of being redelivered forever.
        # Mirrors pos-service and inventory-service, which have always had this block.
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 8000
  cloud:
    config:
      uri: ${CONFIG_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  # Source of truth for @RequiresFeature checks — shared-lib resolves a feature-flag cache miss
  # from platform-admin (which owns tenant_features). Without it every gated endpoint 403s.
  platform-admin:
    uri: ${PLATFORM_ADMIN_URI:http://127.0.0.1:8096}
  jwks:
    uri: ${JWKS_URI:http://auth-service:8081/.well-known/jwks.json}

finance:
  period:
    auto-seed-on-miss: ${FINANCE_PERIOD_AUTO_SEED_ON_MISS:true}
