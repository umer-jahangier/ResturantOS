server:
  port: ${SERVER_PORT:8089}

spring:
  application:
    name: crm-service
  datasource:
    url: ${CRM_DB_URL:jdbc:postgresql://localhost:5432/crm_db}
    username: ${CRM_DB_USER:crm_user}
    password: ${CRM_DB_PASSWORD:crm_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:seed}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # See finance-service for the full reasoning. Short version: Spring AMQP defaults
        # default-requeue-rejected to TRUE, which requeues a failed message onto the head of the
        # same queue with no delay — an unbounded redelivery loop for any handler that throws.
        # crm's two listeners accrue and reverse loyalty points, so a poison ORDER_CLOSED would
        # spin here and block every later accrual behind it.
        # CrmRabbitConfig declares an x-dead-letter-exchange and a bound DLQ per queue, so a
        # rejected message has somewhere to go.
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 8000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  jwks:
    uri: ${JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
