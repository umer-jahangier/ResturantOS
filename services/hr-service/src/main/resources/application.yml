server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: hr-service
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5432/hr_db}
    username: ${HR_DB_USER:hr_user}
    password: ${HR_DB_PASSWORD:hr_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:seed}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  jwks:
    uri: ${JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
  # Deliberately has no default. hr.rego is the ONLY thing enforcing branch isolation on employee,
  # attendance, leave and payroll records — SharedAutoConfiguration registers the OpaClient and
  # AuthorizationService beans only when this is set, so an hr-service deployed without OPA_URL
  # fails to start rather than coming up silently unenforced. Same shape as pos/inventory/kitchen.
  opa:
    url: ${OPA_URL}
  # Field-level encryption key for HR PII columns (employee identity + bank + device token).
  # EncryptionAutoConfiguration is @ConditionalOnProperty(restaurantos.encryption.key), so this
  # property must be present for @Convert(EncryptedStringConverter) fields to activate.
  encryption:
    key: ${FIELD_ENCRYPTION_KEY:}
