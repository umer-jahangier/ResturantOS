server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: hr-service
  datasource:
    url: ${HR_DB_URL:jdbc:postgresql://localhost:5432/hr_db}
    username: ${HR_DB_USER:hr_user}
    password: ${HR_DB_PASSWORD:hr_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:seed}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  hr:
    # The address an installer types into a terminal's COMM -> Cloud Server screen. Until 25-08 this
    # was unset everywhere, so AttendanceDeviceService fell back to its compiled-in placeholder and
    # the one screen whose entire job is telling somebody what to type told them to replace something
    # - beside a device token shown exactly once, so the only way back was re-registering.
    #
    # A terminal's Server Address field takes a bare host or IP and its Server Port a bare port; the
    # firmware builds the /iclock path itself. So this is deliberately host and port, not a URL.
    device-server-host: ${DEVICE_SERVER_HOST:localhost}
    device-server-port: ${DEVICE_SERVER_PORT:8080}
    # Which header carries the terminal's real source address. SERIAL_ONLY_BOUNDED rests entirely on
    # this being trustworthy - see AdmsRequestContext. Set blank to fall back to the peer address,
    # which fails closed.
    device-source-address-header: ${DEVICE_SOURCE_ADDRESS_HEADER:X-Forwarded-For}
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  jwks:
    uri: ${JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
  # Deliberately has no default. hr.rego is the ONLY thing enforcing branch isolation on employee,
  # attendance, leave and payroll records — SharedAutoConfiguration registers the OpaClient and
  # AuthorizationService beans only when this is set, so an hr-service deployed without OPA_URL
  # fails to start rather than coming up silently unenforced. Same shape as pos/inventory/kitchen.
  opa:
    url: ${OPA_URL}
  # Field-level encryption key for HR PII columns (employee identity + bank + device token).
  # EncryptionAutoConfiguration is @ConditionalOnProperty(restaurantos.encryption.key), so this
  # property must be present for @Convert(EncryptedStringConverter) fields to activate.
  encryption:
    key: ${FIELD_ENCRYPTION_KEY:}
