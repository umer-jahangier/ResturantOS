server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_db}
    # Runtime user: INSERT-only on audit_events (no UPDATE/DELETE grants)
    username: ${AUDIT_DB_USER:audit_writer}
    password: ${AUDIT_DB_PASSWORD:audit_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    # Liquibase runs as admin user for DDL (separate from runtime datasource)
    url: ${AUDIT_DB_ADMIN_URL:${AUDIT_DB_URL:jdbc:postgresql://localhost:5432/audit_db}}
    user: ${AUDIT_DB_ADMIN_USER:audit_admin}
    password: ${AUDIT_DB_ADMIN_PASSWORD:audit_admin_pass}
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # AUTO, not MANUAL. Under MANUAL the container never acks on the application's behalf and
        # every listener here takes only (Message) — no Channel, so basicAck is never called. Each
        # message was therefore handled correctly and then left unacknowledged forever: the broker
        # held it, the consumer's prefetch filled up, and at 250 unacked the consumer would stop
        # receiving anything at all. Observed live at 56 (audit) and climbing, stable across 20s and
        # rebuilt after every restart, because a dropped connection requeues the whole backlog and
        # it is all reprocessed from scratch.
        # AUTO gives these listeners exactly the semantics they are written for: ack on normal
        # return, reject on exception — and EventEnvelopeReader already throws
        # AmqpRejectAndDontRequeueException for poison messages, so those still reach the DLQ.
        # Redelivery stays safe because every consumer is idempotent via processed_events.
        acknowledge-mode: auto

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  # Needed since 15-01: /api/v1/audit/** is the first user-facing endpoint this service has,
  # so it now verifies JWTs against auth-service's published key set like every other service.
  jwks:
    uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
