server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:auth_user}
    password: ${DB_PASSWORD:auth_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: ${LIQUIBASE_CONTEXTS:seed}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  # 16a-01: where PlatformCredentialClient asks "is this a SuperAdmin credential?".
  #
  # A direct origin, NOT `lb://platform-admin-service`. auth-service has no @LoadBalanced
  # RestClient.Builder and adding one for a single call would pull load-balancer configuration into
  # a service that makes no other outbound HTTP call. The default is the dev stack's port; set
  # PLATFORM_ADMIN_SERVICE_URI in any deployment where that is not where it lives.
  platform-admin-service:
    uri: ${PLATFORM_ADMIN_SERVICE_URI:http://localhost:8096}
  auth:
    step-up-enabled: ${AUTH_STEP_UP_ENABLED:true}
    # Control-plane token lifetime (PlatformTokenService). Deliberately NOT jwt.access-ttl-seconds:
    # that is 3600 for tenant users, and a SuperAdmin token — which can provision tenants, toggle
    # features and start impersonation sessions — should not live as long as a cashier's. Platform
    # users also have no refresh path and no TOTP column yet, so the short TTL is the only bound on
    # a leaked control-plane token.
    platform-token-ttl-seconds: ${PLATFORM_TOKEN_TTL_SECONDS:900}
    # 16b-01: how long a platform (SuperAdmin) REFRESH session lives.
    #
    # 30 minutes, against jwt.refresh-ttl-seconds' 7 days for tenant users (604800 in this
    # deployment, via JWT_REFRESH_TTL_SECONDS). A separate property rather than a reuse of that one,
    # so handing a control-plane session the tenant lifetime has to be somebody typing a large
    # number into a field whose name says "platform".
    #
    # Read the javadoc on AuthServiceImpl.platformLoginResult before raising this. Until
    # platform_users has a TOTP column there is no second factor behind a SuperAdmin password, and
    # this TTL plus single-use rotation IS the bound on a leaked one. Raising it to the tenant value
    # is the change that comment warns against.
    platform-refresh-ttl-seconds: ${PLATFORM_REFRESH_TTL_SECONDS:1800}
    # 16a-01: whether the unified email-first login also checks platform (SuperAdmin) credentials.
    #
    # ON here, because with it off the SuperAdmin has no browser login at all — which is the defect
    # this plan repairs. Turn it OFF only for a deployment that runs no platform-admin-service; the
    # effect is that a platform credential simply never matches, which is indistinguishable from a
    # wrong password and therefore leaks nothing about whether a control plane exists.
    platform-login-enabled: ${AUTH_PLATFORM_LOGIN_ENABLED:true}
    # Self-service forgot-password (13-09, D-31).
    #
    # DISABLED by default, and that is a decision rather than an oversight: notification-service is
    # an active Maven module with ZERO source files, so nothing consumes PASSWORD_RESET_REQUESTED
    # and no email is ever sent. Left enabled, this endpoint mints a live credential, writes an
    # event nobody reads, and leaves the user waiting for a message that is not coming.
    #
    # In `disabled` the request endpoint issues nothing, writes nothing, and returns
    # RESET_DELIVERY_DISABLED naming the supported route. Set it to `outbox` ONLY once something
    # consumes that event — on its own the mode changes nothing a user can see.
    #
    # The supported recovery paths in this milestone are an administrator-initiated reset and, for
    # a user who can still sign in, POST /api/v1/auth/change-password.
    # See Docs/known-gaps/notification-delivery.md.
    password-reset:
      delivery-mode: ${PASSWORD_RESET_DELIVERY_MODE:disabled}
      # Minimum interval between two token issuances for ONE account, independent of the gateway's
      # per-IP budget on auth-route. Half the reset token's own 30-minute life, so someone who
      # genuinely lost the first message can ask again while the first token is still live.
      # Refusals inside the window are SILENT — an announced cooldown is an account-existence
      # oracle with a rate limiter attached.
      cooldown: ${PASSWORD_RESET_COOLDOWN:15m}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
    jwt:
      private-key-base64: ${JWT_PRIVATE_KEY:}
      public-key-base64: ${JWT_PUBLIC_KEY:}
      public-key-id: ${JWT_PUBLIC_KEY_ID:dev-key-1}
      access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:3600}
      refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:2592000}
  feature-flags:
    cache-ttl-seconds: 300
  encryption:
    key: ${FIELD_ENCRYPTION_KEY:}
