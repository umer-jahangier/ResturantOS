server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: inventory-service
  config:
    import: optional:configserver:${CONFIG_URI:http://localhost:8888}
  datasource:
    url: ${INVENTORY_DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
    username: ${INVENTORY_DB_USER:inventory_user}
    password: ${INVENTORY_DB_PASSWORD:inventory_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:${RABBITMQ_USER:guest}}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # AUTO, not MANUAL. Under MANUAL the container never acks on the application's behalf and
        # every listener here takes only (Message) — no Channel, so basicAck is never called. Each
        # message was therefore handled correctly and then left unacknowledged forever: the broker
        # held it, the consumer's prefetch filled up, and at 250 unacked the consumer would stop
        # receiving anything at all. Observed live at 56 (audit) and climbing, stable across 20s and
        # rebuilt after every restart, because a dropped connection requeues the whole backlog and
        # it is all reprocessed from scratch.
        # AUTO gives these listeners exactly the semantics they are written for: ack on normal
        # return, reject on exception — and EventEnvelopeReader already throws
        # AmqpRejectAndDontRequeueException for poison messages, so those still reach the DLQ.
        # Redelivery stays safe because every consumer is idempotent via processed_events.
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 8000
  cloud:
    config:
      uri: ${CONFIG_URI:http://localhost:8888}
      fail-fast: false
      retry:
        max-attempts: 3
    openfeign:
      circuitbreaker:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# FinanceCoaClient's chart-of-accounts lookup runs INSIDE the @Transactional category write that
# needs it, so an unbounded timeout would pin a database connection for as long as an unreachable
# finance-service takes to give up — Feign's own defaults are far too generous for that. Bounded to
# the same 5s finance-service uses for its outbound calls, which caps the blast radius of an
# accounting outage at a slow-but-finite 503 on category saves.
feign:
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

restaurantos:
  internal:
    secret: ${INTERNAL_SERVICE_SECRET:dev-internal-secret}
  platform-admin:
    uri: ${PLATFORM_ADMIN_URI:http://127.0.0.1:8096}
  jwks:
    uri: ${JWKS_URI:http://auth-service:8081/.well-known/jwks.json}
  opa:
    url: ${OPA_URL}
